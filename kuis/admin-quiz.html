<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Kuis & Ujian - SIAMO PMR</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="css/quiz.css">
</head>
<body class="rh-body">
  <div class="admin-wrapper">
    <!-- SIDEBAR NAVIGASI -->
    <aside class="sidebar rh-sidebar">
      <div class="sidebar-brand"><span>QUIZ MASTER</span></div>
      <ul class="sidebar-menu">
        <li class="menu-item active" data-target="panelSukaSuka"><span>🎉 Main Suka-Suka</span></li>
        <li class="menu-item" data-target="panelHarian"><span>📚 Tugas Harian</span></li>
        <li class="menu-item" data-target="panelUjian"><span>🏆 Ujian Resmi</span></li>
        <li class="menu-item" data-target="panelRekap"><span>📊 Rekap Nilai</span></li>
      </ul>
      <div class="sidebar-footer">
        <a href="../admin.html" class="btn-logout-admin rh-btn-back">← Admin Utama</a>
      </div>
    </aside>

    <!-- KONTEN UTAMA -->
    <main class="admin-main">
      <header class="admin-header"><h2 id="pageHeaderTitle">Panel Admin: Main Suka-Suka</h2></header>

      <!-- PANEL 1: MAIN SUKA-SUKA -->
      <section id="panelSukaSuka" class="admin-panel">
        <div class="forms-builder-container">
          <div class="forms-header-card" style="border-top-color: #5c3d99;">
            <div class="input-group" style="margin-bottom: 12px;">
              <label style="font-weight: 800; color: #5c3d99;">Judul Room Suka-Suka</label>
              <input type="text" id="titleSuka" placeholder="Contoh: Latihan Cepat Kepalangmerahan">
            </div>
            <div class="input-group">
              <label>Durasi per Soal (Detik)</label>
              <input type="number" id="durationSuka" value="20">
            </div>
          </div>

          <div id="containerSuka" class="cards-stack"></div>

          <div class="center-action">
            <button type="button" onclick="QuizNavMaster.addCard('suka')" class="btn-add-form-question">➕ Tambah Soal Suka-Suka</button>
          </div>

          <div class="right-action">
            <button type="button" onclick="QuizNavMaster.publish('sukasuka')" class="btn-publish-quiz" style="background: #5c3d99;">🚀 Publikasikan Suka-Suka</button>
          </div>
        </div>
      </section>

      <!-- PANEL 2: TUGAS HARIAN -->
      <section id="panelHarian" class="admin-panel hidden">
        <div class="forms-builder-container">
          <div class="forms-header-card" style="border-top-color: #f4d03f;">
            <div class="input-group" style="margin-bottom: 12px;">
              <label style="font-weight: 800; color: #1a1a1a;">Judul Tugas Harian (Masuk Rapor)</label>
              <input type="text" id="titleHarian" placeholder="Contoh: Tugas Harian 1 - Sejarah PMR">
            </div>
            <div class="input-group">
              <label>Durasi per Soal (Detik)</label>
              <input type="number" id="durationHarian" value="45">
            </div>
          </div>

          <div id="containerHarian" class="cards-stack"></div>

          <div class="center-action">
            <button type="button" onclick="QuizNavMaster.addCard('harian')" class="btn-add-form-question">➕ Tambah Soal Tugas Harian</button>
          </div>

          <div class="right-action">
            <button type="button" onclick="QuizNavMaster.publish('harian')" class="btn-publish-quiz" style="background: #f4d03f; color: #1a1a1a;">💾 Simpan Tugas Harian</button>
          </div>
        </div>
      </section>

      <!-- PANEL 3: UJIAN RESMI -->
      <section id="panelUjian" class="admin-panel hidden">
        <div class="forms-builder-container">
          <div class="forms-header-card" style="border-top-color: #d9381e;">
            <div class="input-group" style="margin-bottom: 12px;">
              <label style="font-weight: 800; color: #d9381e;">Judul Ujian Resmi (Masuk Rapor)</label>
              <input type="text" id="titleUjian" placeholder="Contoh: Ujian Akhir Pertolongan Pertama">
            </div>
            <div class="input-group">
              <label>Durasi per Soal (Detik)</label>
              <input type="number" id="durationUjian" value="60">
            </div>
          </div>

          <div id="containerUjian" class="cards-stack"></div>

          <div class="center-action">
            <button type="button" onclick="QuizNavMaster.addCard('ujian')" class="btn-add-form-question">➕ Tambah Soal Ujian Resmi</button>
          </div>

          <div class="right-action">
            <button type="button" onclick="QuizNavMaster.publish('ujian')" class="btn-publish-quiz" style="background: #d9381e;">🚀 Publikasikan Ujian Resmi</button>
          </div>
        </div>
      </section>

      <!-- PANEL 4: REKAP NILAI -->
      <section id="panelRekap" class="admin-panel hidden">
        <div class="forms-builder-container">
          <div class="forms-header-card">
            <h3 style="margin-bottom: 6px;">📊 Rekap Nilai & Peserta Kuis</h3>
            <p style="font-size: 13px; color: #4b5563; margin-bottom: 20px;">Pilih kuis atau ujian untuk melihat daftar nilai siswa.</p>
            <div id="containerQuizRecap"><p class="text-center">Memuat daftar...</p></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- MODAL REKAP PESERTA -->
  <div id="quizSubmissionsModal" class="rh-modal-overlay hidden">
    <div class="rh-modal-card" style="max-width: 600px;">
      <div class="popup-header">
        <h3 id="subModalTitle">Rekap Nilai Siswa</h3>
        <button type="button" class="popup-close-x" onclick="QuizNavMaster.closeModal('quizSubmissionsModal')">&times;</button>
      </div>
      <div class="popup-body" id="subModalBody" style="max-height: 350px; overflow-y: auto; margin: 16px 0;">
        <p>Memuat rekap...</p>
      </div>
      <button type="button" class="btn-publish-quiz" onclick="QuizNavMaster.closeModal('quizSubmissionsModal')" style="width:100%; background:#1a1a1a;">Tutup</button>
    </div>
  </div>

  <!-- MODAL NOTIFIKASI RINGAN -->
  <div id="customAdminModal" class="rh-modal-overlay hidden">
    <div class="rh-modal-card" style="max-width: 380px; text-align: center;">
      <h3 id="modalTitle" style="margin-bottom: 8px; font-size: 18px; font-weight: 800;">Informasi</h3>
      <p id="modalMessage" style="font-size: 14px; color: #374151; margin-bottom: 20px;"></p>
      <button type="button" id="modalBtnOk" class="btn-publish-quiz" style="padding: 10px 24px; width: 100%;">OK</button>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="js/quiz-admin.js"></script>
</body>
</html>
